name: StudyBridge checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Test backend
        run: python -m pytest tests -q
      - name: Check for missing public assets
        run: test -s index.html && test -s sw.js && test -s manifest.webmanifest
